th:900px){

.card{overflow-x:auto}table{min-width:560px}.tabs{overflow-x:auto;white-space:nowrap}.ctl{gap:6px}

<section id="login">

<script>

const V=[['102','شرکت حمل‌ونقل آرمان','۱۴۰۴/۰۶/۲۵ ۱۳:۴۵:۲۱','روشن','4G',1],['106','ناوگان آزمایشی','۱۴۰۴/۰۶/۲۵ ۱۳:۴۲:۱۰','خاموش','4G',1],['108','ناوگان مرکزی','۱۴۰۴/۰۶/۲۵ ۱۳:۳۵:۰۵','خاموش','3G',0]];

const VEH=[['102',51.39,35.69,1],['106',50.5,36.05,1],['108',50.88,34.64,0]];
function MAPS(ex=''){

return `<svg viewBox="0 0 923 800" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block;font-family:Tahoma,Arial,sans-serif"><rect width="923" height="800" fill="#efe9d6"/>
<polygon points="${pts([[49.4,37.0],[50.5,36.7],[52,36.4],[53.5,36.4],[54,36.2],[54,35.5],[52.5,35.9],[51.2,36.0],[50,36.1]])}" fill="#d7d3bd"/>

${CITY.map(([n,o,a])=>{const [x,y]=P(o,a),b=n=='تهران';return `<circle cx="${x}" cy="${y}" r="${b?7:4.5}" fill="#555" stroke="#fff" stroke-width="2"/><text x="${x}" y="${y-(b?13:9)}" text-anchor="middle" font-size="${b?18:14}" font-weight="${b?700:400}" fill="#222" stroke="#fff" stroke-width="4" paint-order="stroke">${n}</text>`}).join('')}
${VEH.map(([n,o,a,on])=>{const [x,y]=P(o,a);return `<g transform="translate(${x+14},${y+4})"><rect width="44" height="22" rx="4" fill="${on?'#1fa25a':'#8a96a3'}" stroke="#fff" stroke-width="2"/><text x="22" y="16" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">${n}</text></g>`}).join('')}

 if(0)VEH.forEach(([n,o,a,on])=>L.marker([a,o],{icon:L.divIcon({className:'',html:`<div class="vm ${on?'':'off'}">${n}</div>`,iconSize:[44,22],iconAnchor:[22,30]})}).addTo(m).bindPopup('خودرو '+n+(on?' — آنلاین':' — آفلاین')));

const STT=['وضعیت','رویداد','هشدار عادی','هشدار هوش مصنوعی','راننده'];

function stc(i){if(!i)return `<table><tr><th>نام دستگاه (شناسه)</th><th>ناوگان</th><th>زمان</th><th>وضعیت سوئیچ</th><th>شبکه</th></tr>${V.map(v=>`<tr><td><span class="d ${v[5]?'':'g'}"></span> ${v[0]} (T${v[0]})</td><td>${v[1]}</td><td>${v[2]}</td><td>${v[3]}</td><td>${v[4]}</td></tr>`).join('')}</table>`;const d=STD[i];return `<table><tr>${d[0].map(x=>`<th>${x}</th>`).join('')}</tr>${d[1].map(r=>`<tr>${r.map(c=>`<td>${cell(c)}</td>`).join('')}</tr>`).join('')}</table>`}
function stab(i){document.querySelectorAll('#stt span').forEach((e,j)=>e.classList.toggle('on',j==i));st.innerHTML=stc(i)}

document.addEventListener('keydown',e=>{if(e.key=='Escape')lb.style.display='none'});

const stat=()=>`<div class="card"><div class="tabs" id="stt">${STT.map((t,i)=>`<span class="${i?'':'on'}" onclick="stab(${i})" style="cursor:pointer">${t}</span>`).join('')}</div><div id="st">${stc(0)}</div></div>`;
const tile=(i,n,red)=>`<div class="t ${red?'red':''}">${i<6?`<img src="${IM[i]}">`:'<div class="nv">بدون تصویر</div>'}<p><span>${n}</span><span class="d"></span></p>${i<6?`<div class="ov" id="ov${i}"></div>`:''}</div>`;

if(s=='موقعیت لحظه‌ای')h=tree()+`<div class="col"><div class="card map">${MAP()}</div>${stat()}</div>`;
else if(s=='پایش ویدئو')h=tree()+`<div class="col"><div class="card ctl"><div><label>نوع پایش</label><div class="f">چرخه‌ای</div></div><div><label>وضعیت سوئیچ</label><div class="f">همه وضعیت‌ها</div></div><div><label>حالت پایش</label><div class="f">توالی‌دار</div></div><div><label>کانال</label><div class="f">همه</div></div><div><label>زمان پایش (ثانیه)</label><input class="f" type="number" value="60" style="width:80px"></div><div><label>محدودیت داده</label><div class="f">بدون محدودیت</div></div><button class="stop" onclick="plt(this)">توقف</button></div><div class="card wall">${tile(0,'102 [جلو]',1)}${tile(1,'102 [عقب]',1)}${tile(2,'۱۰۶ [کانال ۱]')}${tile(3,'۱۰۶ [کانال ۲]')}${tile(4,'108 [جلو]')}${tile(5,'108 [عقب]')}${tile(6,'سایر کانال‌ها')}${tile(7,'کانال‌های اضافی')}</div>${stat()}</div>`;
else if(s=='نمای کلی')h=`<div class="pg"><div class="card ctl"><button class="btn">امروز</button><span class="f">دیروز</span><span class="f">۷ روز گذشته</span><span class="f">۳۰ روز گذشته</span><span class="f">انتخاب ناوگان</span><button class="btn">اعمال</button></div><div class="kp"><div class="k" style="background:#8bb722">۶<small>جمع کل</small></div><div class="k" style="background:#2f9ae8">۳<small>آنلاین</small></div><div class="k" style="background:#ee5a54">۰<small>خراب</small></div><div class="k" style="background:#f6b02c">۱<small>بدون ارتباط طولانی</small></div></div><div class="g"><div class="card"><b>وضعیت حرکت خودروها</b><p>در حال حرکت: ۱ · پارکینگ: ۲ · بدون موقعیت: ۰</p></div><div class="card"><b>هشدار خودروها</b><div class="hb" style="width:90%;background:#f28b8b"></div><div class="hb" style="width:25%;background:#f5c26b"></div><div class="hb" style="width:6%;background:#7bc67e"></div></div><div class="card"><b>رفتار راننده</b><p style="color:var(--m)">اطلاعاتی برای نمایش وجود ندارد</p></div></div><div class="g"><div class="card" style="grid-column:span 2"><b>توزیع هشدارها</b><p style="color:var(--m)">داده‌ای برای نمایش وجود ندارد</p></div><div class="card"><b>مصرف داده</b><p>کل: ۲۴.۵ گیگابایت · امروز: ۱.۲ گیگابایت</p></div></div></div>`;
else if(CU[s])h=CU[s]();else if(S[s])h=`<div class="pg">${hd(s)}${K(S[s].k)}${fl(S[s].f,S[s].b)}${TB(S[s].c,S[s].r,S[s].a)}</div>`;
mn.innerHTML=h;initMaps()}
